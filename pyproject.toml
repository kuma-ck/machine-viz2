[project]
name = "machine-viz"
version = "0.1.0"
description = "機器情報可視化 Webアプリケーション"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.2",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "pillow>=12.1.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "lightgbm>=4.3.0",
    "shap>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
