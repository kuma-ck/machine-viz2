{% extends "base.html" %}

{% block title %}パトロール結果一覧 - 機器情報可視化{% endblock %}

{% block content %}
<div class="filter-bar compact-filter">
    <!-- フィルター設定 - 1行コンパクト構成 -->
    <div class="filter-row-compact">
        <div class="filter-group">
            <label>ランク</label>
            <select id="rank-select" class="form-select form-select-sm" style="width: 70px;">
                <option value="">全て</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>
        <div class="filter-group">
            <label>シリーズ</label>
            <select id="series-select" class="form-select form-select-sm" style="width: 100px;">
                <option value="">全て</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>
        <div class="filter-group">
            <label>機種</label>
            <div class="dropdown-multiselect">
                <button id="model-select-btn" class="form-select form-select-sm"
                    style="text-align: left; width: 110px;">
                    全選択
                </button>
                <div id="model-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-header">
                        <label><input type="checkbox" id="model-select-all" checked> 全選択</label>
                    </div>
                    <div id="model-list" class="dropdown-list"></div>
                </div>
            </div>
        </div>
        <div class="filter-group">
            <label>分類</label>
            <select id="category-select" class="form-select form-select-sm" style="width: 100px;">
                <option value="">全て</option>
                <option value="動作不良">動作不良</option>
                <option value="センサー異常">センサー</option>
                <option value="通信エラー">通信</option>
                <option value="部品劣化">部品劣化</option>
            </select>
        </div>
        <div class="filter-group">
            <label>コード</label>
            <input type="text" id="code-input" class="form-input form-input-sm" placeholder="E123" style="width: 70px;">
        </div>
        <div class="filter-group">
            <label>ロジック</label>
            <select id="logic-select" class="form-select form-select-sm" style="width: 90px;">
                <option value="">全て</option>
                <option value="温度異常検知">温度</option>
                <option value="振動異常検知">振動</option>
                <option value="通信切断検知">通信</option>
                <option value="モーター過負荷検知">モーター</option>
                <option value="電圧低下検知">電圧</option>
            </select>
        </div>
        <div class="filter-group">
            <label>アラート</label>
            <select id="alert-select" class="form-select form-select-sm" style="width: 70px;">
                <option value="">全て</option>
                <option value="true">あり</option>
                <option value="false">なし</option>
            </select>
        </div>
        <div class="filter-group">
            <label>期間</label>
            <div class="date-range-compact">
                <input type="date" id="start-date" class="form-input form-input-sm">
                <span>～</span>
                <input type="date" id="end-date" class="form-input form-input-sm">
            </div>
        </div>
        <button id="search-btn" class="btn btn-sm btn-primary">検索</button>
    </div>
</div>

<div class="main-area patrol-main">
    <!-- 詳細リストエリア -->
    <div class="search-results">
        <div class="results-header-compact">
            <span class="result-label">検索結果: <strong id="result-count">0</strong>件</span>
        </div>
        <div class="table-container" style="max-height: calc(100vh - 200px); overflow-y: auto;">
            <table class="data-table compact hoverable dense">
                <thead>
                    <tr>
                        <th class="sortable" data-sort="rank" style="width: 50px;">ランク<span class="sort-icon"></span>
                        </th>
                        <th class="sortable" data-sort="series" style="width: 70px;">シリーズ<span class="sort-icon"></span>
                        </th>
                        <th class="sortable" data-sort="model" style="width: 70px;">機種<span class="sort-icon"></span>
                        </th>
                        <th class="sortable" data-sort="machine_id" style="width: 100px;">機番<span
                                class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_category" style="width: 80px;">分類<span
                                class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_code" style="width: 60px;">コード<span
                                class="sort-icon"></span></th>
                        <th class="sortable" data-sort="target_date" style="width: 100px;">対象日<span
                                class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_count" style="width: 50px;">件数<span
                                class="sort-icon"></span></th>
                        <th class="sortable" data-sort="logic_content" style="width: 90px;">ロジック<span
                                class="sort-icon"></span></th>
                        <th class="sortable" data-sort="alert_flag" style="width: 60px;">警告<span
                                class="sort-icon"></span></th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- JSで挿入 -->
                </tbody>
            </table>
        </div>

        <!-- ページネーション - コンパクト版 -->
        <div class="pagination-compact">
            <div class="pagination-info-compact">
                <span id="total-count">0</span>件中 <span id="start-count">0</span>-<span id="end-count">0</span>件
            </div>
            <div class="pagination-controls-compact">
                <select id="page-size" class="form-select form-select-sm">
                    <option value="30">30件</option>
                    <option value="50">50件</option>
                    <option value="100">100件</option>
                </select>
                <button id="prev-page" class="btn btn-sm btn-secondary" disabled>◀</button>
                <span class="page-indicator">
                    <input type="number" id="current-page-input" value="1" min="1"> / <span id="total-pages">1</span>
                </span>
                <button id="next-page" class="btn btn-sm btn-secondary" disabled>▶</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/patrol_result.js"></script>
{% endblock %}
