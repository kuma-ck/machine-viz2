<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mona{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/">Mona</a>
        </div>
        <div class="navbar-menu">
            <a href="/patrol/list"
                class="navbar-item {% if request.url.path.startswith('/patrol') %}active{% endif %}">パトロール結果一覧</a>
            <a href="/defect-trend"
                class="navbar-item {% if request.url.path.startswith('/defect-trend') %}active{% endif %}">不具合傾向表示</a>
            <a href="/search"
                class="navbar-item {% if request.url.path.startswith('/search') %}active{% endif %}">機番検索</a>
            <a href="/history"
                class="navbar-item {% if request.url.path.startswith('/history') %}active{% endif %}">機番履歴表示</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>

</html>
