<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mona{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/"><img src="/static/favicon.png" alt="Mona" class="brand-icon"> Mona</a>
        </div>
        <div class="navbar-menu">
            <a href="/patrol/list" class="navbar-item {% if request.url.path.startswith('/patrol') %}active{% endif %}">
                <i data-lucide="shield-check"></i> パトロール結果
            </a>
            <a href="/defect-trend"
                class="navbar-item {% if request.url.path.startswith('/defect-trend') %}active{% endif %}">
                <i data-lucide="trending-up"></i> 不具合傾向
            </a>
            <a href="/search" class="navbar-item {% if request.url.path.startswith('/search') %}active{% endif %}">
                <i data-lucide="search"></i> 機番検索
            </a>
            <a href="/history" class="navbar-item {% if request.url.path.startswith('/history') %}active{% endif %}">
                <i data-lucide="history"></i> 機番履歴
            </a>
            <a href="/data-catalog"
                class="navbar-item {% if request.url.path.startswith('/data-catalog') %}active{% endif %}">
                <i data-lucide="database"></i> データカタログ
            </a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
    <script>lucide.createIcons();</script>
</body>

</html>
