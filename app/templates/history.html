{% extends "base.html" %}

{% block title %}機番履歴表示 - Mona{% endblock %}

{% block content %}
<div class="history-container-v2">
    <!-- 上部ツールバー -->
    <header class="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-group">
                <select id="preset-select" class="form-select form-select-sm">
                    <option value="">プリセット</option>
                </select>
                <button id="save-preset-btn" class="btn btn-sm btn-secondary" title="保存">💾</button>
                <button id="delete-preset-btn" class="btn btn-sm btn-danger" title="削除">🗑</button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <input type="text" id="machine-number" class="form-input form-input-sm" placeholder="機番を入力">
                <button id="load-data-btn" class="btn btn-sm btn-primary">読み込み</button>
            </div>
        </div>
        <div class="toolbar-right">
            <button id="copy-url-btn" class="btn btn-sm btn-secondary">URLコピー</button>
            <button id="zoom-reset-btn" class="btn btn-sm btn-secondary">ズームリセット</button>
        </div>
    </header>

    <!-- フィルターバー -->
    <!-- フィルターバー -->
    <div class="filter-bar no-wrap-layout">
        <!-- 上段：クエリ設定（系列1・系列2） -->
        <div class="filter-row-primary">
            <!-- 系列1 -->
            <div id="series-1-container" class="series-container">
                <div class="filter-group">
                    <label>カテゴリー1</label>
                    <select id="category-select-1" class="form-select form-select-sm">
                        <option value="">選択</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="filter-group">
                    <label>特性値1</label>
                    <select id="characteristic-select-1" class="form-select form-select-sm" disabled>
                        <option value="">選択</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>集計1</label>
                    <select id="aggregation-method-1" class="form-select form-select-sm">
                        <option value="latest">最新</option>
                        <option value="avg">平均</option>
                        <option value="max">最大</option>
                        <option value="min">最小</option>
                    </select>
                </div>
                <div class="filter-divider"></div>
            </div>

            <!-- 系列2 -->
            <div id="series-2-container" class="series-container" style="display: none;">
                <div class="filter-group">
                    <label style="color: var(--color-primary);">カテゴリー2</label>
                    <select id="category-select-2" class="form-select form-select-sm">
                        <option value="">選択</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="filter-group">
                    <label style="color: var(--color-primary);">特性値2</label>
                    <select id="characteristic-select-2" class="form-select form-select-sm" disabled>
                        <option value="">選択</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label style="color: var(--color-primary);">集計2</label>
                    <select id="aggregation-method-2" class="form-select form-select-sm">
                        <option value="latest">最新</option>
                        <option value="avg">平均</option>
                        <option value="max">最大</option>
                        <option value="min">最小</option>
                    </select>
                </div>
                <button id="remove-series-btn" class="btn btn-sm btn-danger" title="系列を削除"
                    style="padding: 2px 6px;">×</button>
            </div>

            <button id="add-series-btn" class="btn btn-sm btn-secondary" title="系列を追加">+ 系列を追加</button>
        </div>

        <!-- 下段：表示設定（グラフ、X軸、アノテーション） -->
        <div class="filter-row-secondary">
            <div class="filter-group">
                <label>グラフ</label>
                <div class="btn-toggle">
                    <input type="radio" name="chart-type" value="line" id="chart-line" checked>
                    <label for="chart-line">折れ線</label>
                    <input type="radio" name="chart-type" value="color" id="chart-color">
                    <label for="chart-color">カラー</label>
                </div>
            </div>

            <div class="filter-divider"></div>

            <div class="filter-group">
                <label>X軸</label>
                <select id="x-axis-type" class="form-select form-select-sm">
                    <option value="monthly">月次</option>
                    <option value="daily">日次</option>
                    <option value="usage">使用回数</option>
                </select>
                <div id="date-range-container" style="display: none; align-items: center; gap: 4px; margin-left: 8px;">
                    <input type="date" id="start-date" class="form-input form-input-sm" style="width: 140px;">
                    <span>~</span>
                    <input type="date" id="end-date" class="form-input form-input-sm" style="width: 140px;">
                </div>
            </div>

            <div class="filter-divider"></div>

            <div class="filter-group annotation-group">
                <label>アノテーション</label>
                <div class="annotation-toggles">
                    <label class="chip"><input type="checkbox" class="annotation-toggle" data-type="FW更新" checked>
                        FW更新</label>
                    <label class="chip"><input type="checkbox" class="annotation-toggle" data-type="部品交換" checked>
                        部品交換</label>
                    <label class="chip"><input type="checkbox" class="annotation-toggle" data-type="メンテナンス" checked>
                        メンテナンス</label>
                    <label class="chip"><input type="checkbox" class="annotation-toggle" data-type="不具合発生" checked>
                        不具合発生</label>
                </div>
            </div>
        </div>
    </div>

    <!-- メインエリア：グラフ + 機番属性 -->
    <div class="main-area">
        <div class="chart-area">
            <div class="chart-header">
                <h2 id="chart-title">機番データ</h2>
            </div>

            <!-- 空状態ガイド -->
            <div id="empty-state" class="empty-state">
                <div class="empty-state-icon">📊</div>
                <h3>データを表示するには</h3>
                <ol class="empty-state-steps">
                    <li><strong>機番を入力</strong>して「読み込み」をクリック</li>
                    <li><strong>カテゴリーと特性値</strong>を選択</li>
                </ol>
            </div>

            <!-- メインチャート -->
            <div id="main-chart" class="main-chart" style="display: none;"></div>

            <!-- ローディング -->
            <div id="loading" class="loading-overlay" style="display: none;">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- 機番属性サイドバー -->
        <aside id="machine-info" class="info-sidebar" style="display: none;">
            <h3>機番属性</h3>
            <div id="machine-info-content" class="info-list"></div>
        </aside>
    </div>

    <!-- 下部エリア：2カラムテーブル -->
    <div class="tables-area">
        <!-- イベント情報 -->
        <div class="table-section" id="events-section">
            <div class="table-header">
                <h3>イベント情報</h3>
            </div>
            <div class="table-scroll">
                <table class="data-table compact">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>種別</th>
                            <th>コード</th>
                            <th>説明</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- 詳細データ -->
        <div class="table-section" id="detail-section">
            <div class="table-header">
                <h3>詳細データ</h3>
                <div class="table-controls">
                    <select id="page-size" class="form-select form-select-sm">
                        <option value="10">10件</option>
                        <option value="20" selected>20件</option>
                        <option value="50">50件</option>
                    </select>
                    <button id="download-csv-btn" class="btn btn-sm btn-secondary">CSV</button>
                </div>
            </div>
            <div class="table-scroll">
                <table class="data-table compact" id="detail-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="date">日付</th>
                            <th class="sortable" data-sort="value">値</th>
                            <th>使用回数</th>
                        </tr>
                    </thead>
                    <tbody id="detail-table-body"></tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="prev-page" class="btn btn-sm" disabled>前</button>
                <span class="page-info">
                    <input type="number" id="page-input" class="page-input" value="1" min="1">
                    / <span id="total-pages">1</span>
                </span>
                <button id="next-page" class="btn btn-sm">次</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/history.js"></script>
{% endblock %}
