{% extends "base.html" %}

{% block title %}不具合傾向表示 - Mona{% endblock %}

{% block content %}
<div class="filter-bar">
    <!-- フィルター設定 -->
    <!-- 1段目: フィルター項目 -->
    <div class="filter-row-primary">
        <!-- 期間フィルター(別グループ) -->
        <div class="filter-group"
            style="margin-right: var(--spacing-md); padding-right: var(--spacing-md); border-right: 2px solid var(--border-color);">
            <label style="font-weight: 600;">期間</label>
            <div class="date-range">
                <input type="date" id="start-date" class="form-input form-input-sm">
                <span>～</span>
                <input type="date" id="end-date" class="form-input form-input-sm">
            </div>
        </div>

        <!-- その他のフィルター -->
        <div class="filter-group">
            <label>機種シリーズ</label>
            <select id="series-select" class="form-select form-select-sm">
                <option value="">選択してください</option>
                <!-- JSで動的生成 -->
            </select>
        </div>
        <div class="filter-group" style="flex-grow: 1; max-width: 300px;">
            <label>機種番号</label>
            <div class="dropdown-multiselect">
                <button id="model-select-btn" class="form-select form-select-sm" style="text-align: left;">
                    機種を選択(全選択中)
                </button>
                <div id="model-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-header">
                        <label><input type="checkbox" id="model-select-all" checked> 全選択/解除</label>
                    </div>
                    <div id="model-list" class="dropdown-list">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </div>
        </div>
        <div class="filter-group">
            <label>不具合分類</label>
            <select id="category-select" class="form-select form-select-sm">
                <option value="">全分類</option>
                <option value="動作不良">動作不良</option>
                <option value="センサー異常">センサー異常</option>
                <option value="通信エラー">通信エラー</option>
                <option value="部品劣化">部品劣化</option>
            </select>
        </div>
        <div class="filter-group">
            <label>不具合コード</label>
            <select id="code-select" class="form-select form-select-sm" style="width: auto;">
                <option value="">全コード</option>
                <!-- JSで動的生成 -->
            </select>
        </div>
    </div>

    <!-- 2段目: アクションボタン(左右に分割) -->
    <div class="filter-row-secondary"
        style="display: flex; justify-content: space-between; align-items: center; padding-top: var(--spacing-sm);">
        <!-- 左側: 主要操作ボタン -->
        <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
            <button id="search-btn" class="btn btn-sm btn-primary">更新</button>
            <button id="reset-btn" class="btn btn-sm btn-secondary">リセット</button>
        </div>

        <!-- 右側: 補助機能ボタン -->
        <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
            <button id="copy-url-btn" class="btn btn-sm btn-outline-secondary" title="現在の条件でURLをコピー">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                Copy URL
            </button>
            <div class="dropdown-menu-container">
                <button id="preset-btn" class="btn btn-sm btn-outline-secondary">
                    <span style="color: #fbbf24;">★</span> プリセット
                </button>
                <div id="preset-menu" class="dropdown-menu hidden">
                    <div class="preset-header">
                        <input type="text" id="preset-name-input" placeholder="プリセット名を入力"
                            class="form-input form-input-sm">
                        <button id="save-preset-btn" class="btn btn-xs btn-primary">保存</button>
                    </div>
                    <div class="preset-list-label">保存済みプリセット</div>
                    <div id="preset-list" class="preset-list">
                        <!-- JSで生成 -->
                        <div class="empty-message">保存されたプリセットはありません</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="main-area-stacked">
    <!-- 上段：チャートエリア -->
    <div class="chart-area" style="height: 400px; margin-bottom: var(--spacing-md);">
        <div class="chart-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>不具合発生推移</h2>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div id="trend-summary" style="font-size: 0.85rem; color: var(--text-secondary);">
                    <!-- Populated by JS -->
                </div>
                <div class="btn-group" role="group" style="font-size: 0.85rem;">
                    <button id="daily-btn" class="btn btn-sm btn-primary"
                        style="border-radius: 4px 0 0 4px;">日次</button>
                    <button id="monthly-btn" class="btn btn-sm btn-outline-secondary"
                        style="border-radius: 0 4px 4px 0;">月次</button>
                </div>
            </div>
        </div>
        <div id="trend-chart" style="width: 100%; height: 350px;"></div>
    </div>

    <!-- 中段：製造月分布比較チャート -->
    <div class="chart-area" style="height: 400px; margin-bottom: var(--spacing-md);">
        <div class="chart-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>製造月別分布比較</h2>
            <div id="data-summary" style="font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 1rem;">
                <!-- Populated by JS -->
            </div>
        </div>
        <div id="distribution-chart" style="width: 100%; height: 350px;"></div>
    </div>

    <!-- 中段2：製造拠点別分布比較チャート -->
    <div class="chart-area" style="height: 400px; margin-bottom: var(--spacing-md);">
        <div class="chart-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>製造拠点別分布比較</h2>
            <div id="site-dist-summary"
                style="font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 1rem;">
                <!-- Populated by JS -->
            </div>
        </div>
        <div id="site-distribution-chart" style="width: 100%; height: 350px;"></div>
    </div>


    <!-- 下段：詳細リストエリア -->
    <div class="search-results">
        <div class="results-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3>該当機番一覧: <span id="result-count">0</span>件</h3>
            <button id="copy-machines-btn" class="btn btn-sm btn-secondary">機番コピー</button>
        </div>
        <div class="table-container" style="max-height: 400px; overflow-y: auto;">
            <table class="data-table compact">
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="table-select-all"></th>
                        <th class="sortable" data-sort="machine_id">機番 <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="series">シリーズ <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="model">機種 <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_date">不具合発生日 <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_category">不具合内容 <span class="sort-icon"></span></th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- JSで挿入 -->
                </tbody>
            </table>
        </div>

        <!-- ページネーション -->
        <div class="pagination-container"
            style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
            <div class="pagination-info">
                <span id="total-count">0</span> 件中
                <span id="start-count">0</span> - <span id="end-count">0</span> 件を表示
            </div>
            <div class="pagination-controls" style="display: flex; gap: 0.5rem; align-items: center;">
                <select id="page-size" class="form-select" style="width: auto;">
                    <option value="20">20件 / ページ</option>
                    <option value="50">50件 / ページ</option>
                    <option value="100">100件 / ページ</option>
                </select>
                <button id="prev-page" class="btn btn-secondary" disabled>前へ</button>
                <span style="margin: 0 0.5rem;">
                    Page <input type="number" id="current-page-input" value="1" min="1"
                        style="width: 50px; text-align: center;"> / <span id="total-pages">1</span>
                </span>
                <button id="next-page" class="btn btn-secondary" disabled>次へ</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/defect_trend.js"></script>
{% endblock %}
