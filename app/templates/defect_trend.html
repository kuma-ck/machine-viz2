{% extends "base.html" %}

{% block title %}不具合傾向表示 - 機器情報可視化{% endblock %}

{% block content %}
<div class="filter-bar">
    <!-- フィルター設定 -->
    <div class="filter-row-primary">
        <div class="filter-group">
            <label>機種シリーズ</label>
            <select id="series-select" class="form-select form-select-sm">
                <option value="">選択してください</option>
                <!-- JSで動的生成 -->
            </select>
        </div>
        <div class="filter-group" style="flex-grow: 1; max-width: 400px;">
            <label>機種番号</label>
            <div class="dropdown-multiselect">
                <button id="model-select-btn" class="form-select form-select-sm" style="text-align: left;">
                    機種を選択（全選択中）
                </button>
                <div id="model-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-header">
                        <label><input type="checkbox" id="model-select-all" checked> 全選択/解除</label>
                    </div>
                    <div id="model-list" class="dropdown-list">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </div>
        </div>
        <div class="filter-group">
            <label>不具合分類</label>
            <select id="category-select" class="form-select form-select-sm">
                <option value="">全分類</option>
                <option value="動作不良">動作不良</option>
                <option value="センサー異常">センサー異常</option>
                <option value="通信エラー">通信エラー</option>
                <option value="部品劣化">部品劣化</option>
            </select>
        </div>
        <div class="filter-group">
            <label>不具合コード</label>
            <select id="code-select" class="form-select form-select-sm" style="width: auto;">
                <option value="">全コード</option>
                <!-- JSで動的生成 -->
            </select>
        </div>
        <div class="filter-group">
            <label>期間</label>
            <div class="date-range">
                <input type="date" id="start-date" class="form-input form-input-sm">
                <span>～</span>
                <input type="date" id="end-date" class="form-input form-input-sm">
            </div>
        </div>
        <button id="search-btn" class="btn btn-sm btn-primary">更新</button>
    </div>
</div>

<div class="main-area-stacked">
    <!-- 上段：チャートエリア -->
    <div class="chart-area" style="height: 400px; margin-bottom: var(--spacing-md);">
        <div class="chart-header">
            <h2>不具合発生推移</h2>
        </div>
        <div id="trend-chart" style="width: 100%; height: 350px;"></div>
    </div>

    <!-- 中段：製造月分布比較チャート -->
    <div class="chart-area" style="height: 400px; margin-bottom: var(--spacing-md);">
        <div class="chart-header">
            <h2>製造月別分布比較</h2>
        </div>
        <div id="distribution-chart" style="width: 100%; height: 350px;"></div>
    </div>

    <!-- 下段：詳細リストエリア -->
    <div class="search-results">
        <div class="results-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3>該当機番一覧: <span id="result-count">0</span>件</h3>
            <button id="copy-machines-btn" class="btn btn-sm btn-secondary">機番コピー</button>
        </div>
        <div class="table-container" style="max-height: 400px; overflow-y: auto;">
            <table class="data-table compact">
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="table-select-all"></th>
                        <th class="sortable" data-sort="machine_id">機番 <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="series">シリーズ <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="model">機種 <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_date">不具合発生日 <span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="defect_category">不具合内容 <span class="sort-icon"></span></th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- JSで挿入 -->
                </tbody>
            </table>
        </div>

        <!-- ページネーション -->
        <div class="pagination-container"
            style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
            <div class="pagination-info">
                <span id="total-count">0</span> 件中
                <span id="start-count">0</span> - <span id="end-count">0</span> 件を表示
            </div>
            <div class="pagination-controls" style="display: flex; gap: 0.5rem; align-items: center;">
                <select id="page-size" class="form-select" style="width: auto;">
                    <option value="20">20件 / ページ</option>
                    <option value="50">50件 / ページ</option>
                    <option value="100">100件 / ページ</option>
                </select>
                <button id="prev-page" class="btn btn-secondary" disabled>前へ</button>
                <span style="margin: 0 0.5rem;">
                    Page <input type="number" id="current-page-input" value="1" min="1"
                        style="width: 50px; text-align: center;"> / <span id="total-pages">1</span>
                </span>
                <button id="next-page" class="btn btn-secondary" disabled>次へ</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/defect_trend.js"></script>
{% endblock %}
